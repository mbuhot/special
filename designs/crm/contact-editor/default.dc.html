<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Contact editor</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          input:not([type="checkbox"]):not([type="radio"]), select, button {
            box-sizing: border-box;
            height: 36px;
            margin: 0;
            font-family: inherit;
            font-size: 14px;
            line-height: 20px;
            vertical-align: middle;
          }
          select, input[type="date"] {
            -webkit-appearance: none;
            appearance: none;
          }
          select {
            padding-right: 28px !important;
            background-image: linear-gradient(45deg, transparent 50%, #64748b 50%), linear-gradient(135deg, #64748b 50%, transparent 50%) !important;
            background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50% !important;
            background-size: 5px 5px, 5px 5px !important;
            background-repeat: no-repeat !important;
          }
          td input:not([type="checkbox"]), td select, td button {
            height: 32px;
            font-size: 13px;
          }
          a[data-control][style*="border-radius: 8px"][style*="padding: 8px 16px"] {
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            height: 36px;
          }
          body {
            margin: 0;
            font-family:
              system-ui,
              -apple-system,
              "Segoe UI",
              sans-serif;
            color: #0f172a;
          }
          a {
            color: #1d4ed8;
          }
          a:hover {
            color: #1e40af;
          }
        </style>
      </helmet>
      <div
        style="
          width: 1280px;
          height: 800px;
          display: flex;
          background: #ffffff;
          color: #0f172a;
          font-family:
            system-ui,
            -apple-system,
            &quot;Segoe UI&quot;,
            sans-serif;
          overflow: hidden;
        "
      >
        <nav
          data-surface="Sidebar"
          style="
            width: 240px;
            height: 800px;
            box-sizing: border-box;
            flex: none;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 20px 16px;
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
          "
        >
          <div style="padding: 4px 12px; font-size: 18px; font-weight: 700; color: #0f172a">
            Ledger CRM
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <a
              href="../../dashboard/dashboard/default.dc.html"
              data-control="Dashboard"
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                border-radius: 8px;
                color: #334155;
                font-size: 14px;
                font-weight: 500;
                text-decoration: none;
              "
            >
              <svg
                aria-hidden="true"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="flex: none"
              >
                <rect x="3" y="3" width="7" height="9" rx="1" />
                <rect x="14" y="3" width="7" height="5" rx="1" />
                <rect x="14" y="12" width="7" height="9" rx="1" />
                <rect x="3" y="16" width="7" height="5" rx="1" />
              </svg>
              <span>Dashboard</span>
            </a>
            <a
              href="../../crm/contact-list/default.dc.html"
              data-control="Contacts"
              aria-current="page"
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                border-radius: 8px;
                background: #eff6ff;
                color: #1d4ed8;
                font-size: 14px;
                font-weight: 600;
                text-decoration: none;
              "
            >
              <svg
                aria-hidden="true"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="flex: none"
              >
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" />
              </svg>
              <span>Contacts</span>
            </a>
            <a
              href="../../crm/company-list/default.dc.html"
              data-control="Companies"
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                border-radius: 8px;
                color: #334155;
                font-size: 14px;
                font-weight: 500;
                text-decoration: none;
              "
            >
              <svg
                aria-hidden="true"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="flex: none"
              >
                <path d="M4 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16" />
                <path d="M14 10h5a1 1 0 0 1 1 1v10" />
                <path d="M8 8h2M8 12h2M8 16h2M2 21h20" />
              </svg>
              <span>Companies</span>
            </a>
            <a
              href="../../pipeline/pipeline-board/default.dc.html"
              data-control="Pipeline"
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                border-radius: 8px;
                color: #334155;
                font-size: 14px;
                font-weight: 500;
                text-decoration: none;
              "
            >
              <svg
                aria-hidden="true"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="flex: none"
              >
                <path d="M3 4h18l-7 8v7l-4 2v-9z" />
              </svg>
              <span>Pipeline</span>
            </a>
            <a
              href="../../pipeline/task-list/default.dc.html"
              data-control="My tasks"
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                border-radius: 8px;
                color: #334155;
                font-size: 14px;
                font-weight: 500;
                text-decoration: none;
              "
            >
              <svg
                aria-hidden="true"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="flex: none"
              >
                <rect x="4" y="4" width="16" height="16" rx="2" />
                <path d="m8 12 3 3 5-6" />
              </svg>
              <span>My tasks</span>
            </a>
            <a
              href="../../invoicing/invoice-list/default.dc.html"
              data-control="Invoices"
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                border-radius: 8px;
                color: #334155;
                font-size: 14px;
                font-weight: 500;
                text-decoration: none;
              "
            >
              <svg
                aria-hidden="true"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="flex: none"
              >
                <path d="M6 3h9l4 4v14H6z" />
                <path d="M14 3v5h5" />
                <path d="M9 13h7M9 17h7" />
              </svg>
              <span>Invoices</span>
            </a>
          </div>
          <div style="flex: 1"></div>
          <div
            data-control="Signed in as"
            style="
              display: flex;
              flex-direction: column;
              gap: 2px;
              padding: 12px;
              border-top: 1px solid #e2e8f0;
            "
          >
            <div style="font-size: 12px; color: #64748b">Signed in as</div>
            <div style="font-size: 14px; font-weight: 600; color: #0f172a">{{ user.name }}</div>
            <div style="font-size: 12px; color: #64748b">sales-rep@example.com</div>
          </div>
          <a
            href="../../shell/login/default.dc.html"
            data-control="Sign out"
            style="
              margin-top: -12px;
              padding: 8px 12px;
              border: 1px solid #cbd5e1;
              border-radius: 8px;
              background: #ffffff;
              color: #334155;
              font-size: 14px;
              font-weight: 600;
              cursor: pointer;
              text-align: center;
              text-decoration: none;
            "
          >
            Sign out
          </a>
        </nav>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 72px; box-sizing: border-box; flex: none; padding: 0 32px; border-bottom: 1px solid #e2e8f0;">
            <h1 data-control="Contact name" style="margin: 0; font-size: 24px; font-weight: 600; color: #0f172a">{{ contact.firstName }} {{ contact.lastName }}</h1>
          </header>
          <main data-surface="Contact editor" style="flex: 1; display: flex; flex-direction: column; align-items: flex-start; padding: 32px; background: #ffffff;">
            <form style="display: flex; flex-direction: column; gap: 16px; width: 480px; display: flex; flex-direction: column; box-sizing: border-box; padding: 20px; border: 1px solid #e2e8f0; border-radius: 8px; background: #ffffff;">
              <div style="display: flex; flex-direction: column; gap: 4px">
                <label for="contact-first-name" style="font-size: 12px; color: #64748b">First name</label>
                <input id="contact-first-name" type="text" data-control="First name" data-field="firstName" value="{{ contact.firstName }}" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #ffffff; color: #0f172a; font-size: 14px; font-family: inherit; box-sizing: border-box;" />
              </div>
              <div style="display: flex; flex-direction: column; gap: 4px">
                <label for="contact-last-name" style="font-size: 12px; color: #64748b">Last name</label>
                <input id="contact-last-name" type="text" data-control="Last name" data-field="lastName" value="{{ contact.lastName }}" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #ffffff; color: #0f172a; font-size: 14px; font-family: inherit; box-sizing: border-box;" />
              </div>
              <div style="display: flex; flex-direction: column; gap: 4px">
                <label for="contact-email" style="font-size: 12px; color: #64748b">Email</label>
                <input id="contact-email" type="email" data-control="Email" data-field="email" value="{{ contact.email }}" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #ffffff; color: #0f172a; font-size: 14px; font-family: inherit; box-sizing: border-box;" />
              </div>
              <div style="display: flex; flex-direction: column; gap: 4px">
                <label for="contact-phone" style="font-size: 12px; color: #64748b">Phone</label>
                <input id="contact-phone" type="text" data-control="Phone" data-field="phone" value="{{ contact.phone }}" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #ffffff; color: #0f172a; font-size: 14px; font-family: inherit; box-sizing: border-box;" />
              </div>
              <div style="display: flex; flex-direction: column; gap: 4px">
                <label for="contact-company" style="font-size: 12px; color: #64748b">Company</label>
                <select id="contact-company" data-control="Company" data-field="company" value="{{ contact.company }}" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #ffffff; color: #0f172a; font-size: 14px; font-family: inherit; box-sizing: border-box;">
                  <sc-for list="{{ allCompanies }}" as="option" hint-placeholder-count="2">
                    <option>{{ option.name }}</option>
                  </sc-for>
                </select>
              </div>
              <div style="display: flex; gap: 8px"><button type="button" data-control="Save" data-saves style="padding: 8px 16px; border: 0; border-radius: 8px; background: #1d4ed8; color: #ffffff; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; text-decoration: none;">Save</button><a href="../contact-list/default.dc.html" data-control="Cancel" style="display: inline-flex; align-items: center; box-sizing: border-box; height: 36px; padding: 8px 16px; border: 1px solid #cbd5e1; border-radius: 8px; background: #ffffff; color: #334155; font-size: 14px; font-weight: 600; text-decoration: none;">Cancel</a></div>
            </form>
          </main>
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"user":{"editor":null,"default":{"name":"Sam Rivera"}},"contact":{"editor":null,"default":{"name":"Ada Lovelace","firstName":"Ada","lastName":"Lovelace","email":"ada@acme.example","phone":"555-0100","company":"Acme"}},"allCompanies":{"editor":null,"default":[{"name":"Acme"},{"name":"Globex"}]},"$preview":{"width":1280,"height":800}}'>
      class Component extends DCLogic {
      renderVals() {
      return { ...this.props };
      }
      }
    </script>
  </body>
</html>
