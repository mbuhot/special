<!-- @dsCard group="Layout" height=300 subtitle="Columns of cards" -->
<main class="ds-main ds-board" style="--ds-board-columns: 2">
  <section class="ds-board__column">
    <h2 class="ds-board__heading">Lead<span class="ds-board__count">2</span></h2>
    <div class="ds-board-card" draggable="true">
      <a href="#" class="ds-board-card__title">Website rebuild</a>
      <span class="ds-board-card__meta">Globex</span>
      <span class="ds-board-card__value">$8,500.00</span>
      <label class="ds-board-card__field">Stage
        <select class="ds-select ds-select--small" aria-label="Stage of Website rebuild"><option>Lead</option><option>Qualified</option></select>
      </label>
    </div>
    <div class="ds-board-card ds-board-card--dragging" draggable="true">
      <a href="#" class="ds-board-card__title">Big deal</a>
      <span class="ds-board-card__meta">Acme</span>
      <span class="ds-board-card__value">$12,000.00</span>
    </div>
  </section>
  <section class="ds-board__column">
    <h2 class="ds-board__heading">Qualified<span class="ds-board__count">1</span></h2>
    <div class="ds-board-card" draggable="true">
      <a href="#" class="ds-board-card__title">Support retainer</a>
      <span class="ds-board-card__meta">Initech</span>
      <span class="ds-board-card__value">$4,200.00</span>
    </div>
  </section>
</main>
