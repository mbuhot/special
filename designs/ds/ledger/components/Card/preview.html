<!-- @dsCard group="Layout" height=260 subtitle="Grouped content" -->
<div class="ds-main ds-grid ds-grid--two">
  <section class="ds-card">
    <h2 class="ds-card__title">Next step</h2>
    <p class="ds-muted" style="margin: 0">Send the proposal to the client.</p>
    <div class="ds-card__footer"><button type="button" class="ds-button ds-button--secondary ds-button--small">Mark done</button></div>
  </section>
  <section class="ds-card ds-card--row">
    <div class="ds-field ds-field--grow">
      <label class="ds-field__label" for="card-task">Task</label>
      <input id="card-task" class="ds-input" placeholder="Call the client" />
    </div>
    <button type="button" class="ds-button ds-button--primary">Add</button>
  </section>
</div>
