<!-- @dsCard group="Forms" height=400 subtitle="Date field with an open month calendar" -->
<div class="ds-main">
  <div class="ds-field ds-field--sm">
    <label for="due" class="ds-field__label">Due date</label>
    <div class="ds-datepicker">
      <input id="due" type="text" class="ds-input ds-datepicker__input" value="20 Oct 2026" />
      <button type="button" class="ds-datepicker__toggle" aria-label="Choose date" aria-expanded="true">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M8 3v4M16 3v4M3 10h18" /></svg>
      </button>
      <div class="ds-datepicker__popover" role="dialog" aria-label="Choose date">
        <div class="ds-datepicker__header">
          <button type="button" class="ds-button ds-button--ghost ds-button--icon" aria-label="Previous month">&#8249;</button>
          <span class="ds-datepicker__title">October 2026</span>
          <button type="button" class="ds-button ds-button--ghost ds-button--icon" aria-label="Next month">&#8250;</button>
        </div>
        <div class="ds-datepicker__weekdays">
          <span class="ds-datepicker__weekday">Mo</span>
          <span class="ds-datepicker__weekday">Tu</span>
          <span class="ds-datepicker__weekday">We</span>
          <span class="ds-datepicker__weekday">Th</span>
          <span class="ds-datepicker__weekday">Fr</span>
          <span class="ds-datepicker__weekday">Sa</span>
          <span class="ds-datepicker__weekday">Su</span>
        </div>
        <div class="ds-datepicker__grid">
          <button type="button" class="ds-datepicker__day ds-datepicker__day--outside" aria-label="28 September" data-value="2026-09-28" data-field="dueDate" data-toggles="datePickerOpen">28</button>
          <button type="button" class="ds-datepicker__day ds-datepicker__day--outside" aria-label="29 September" data-value="2026-09-29" data-field="dueDate" data-toggles="datePickerOpen">29</button>
          <button type="button" class="ds-datepicker__day ds-datepicker__day--outside" aria-label="30 September" data-value="2026-09-30" data-field="dueDate" data-toggles="datePickerOpen">30</button>
          <button type="button" class="ds-datepicker__day" aria-label="1 October" data-value="2026-10-01" data-field="dueDate" data-toggles="datePickerOpen">1</button>
          <button type="button" class="ds-datepicker__day" aria-label="2 October" data-value="2026-10-02" data-field="dueDate" data-toggles="datePickerOpen">2</button>
          <button type="button" class="ds-datepicker__day" aria-label="3 October" data-value="2026-10-03" data-field="dueDate" data-toggles="datePickerOpen">3</button>
          <button type="button" class="ds-datepicker__day" aria-label="4 October" data-value="2026-10-04" data-field="dueDate" data-toggles="datePickerOpen">4</button>
          <button type="button" class="ds-datepicker__day" aria-label="5 October" data-value="2026-10-05" data-field="dueDate" data-toggles="datePickerOpen">5</button>
          <button type="button" class="ds-datepicker__day" aria-label="6 October" data-value="2026-10-06" data-field="dueDate" data-toggles="datePickerOpen">6</button>
          <button type="button" class="ds-datepicker__day" aria-label="7 October" data-value="2026-10-07" data-field="dueDate" data-toggles="datePickerOpen">7</button>
          <button type="button" class="ds-datepicker__day" aria-label="8 October" data-value="2026-10-08" data-field="dueDate" data-toggles="datePickerOpen">8</button>
          <button type="button" class="ds-datepicker__day" aria-label="9 October" data-value="2026-10-09" data-field="dueDate" data-toggles="datePickerOpen">9</button>
          <button type="button" class="ds-datepicker__day" aria-label="10 October" data-value="2026-10-10" data-field="dueDate" data-toggles="datePickerOpen">10</button>
          <button type="button" class="ds-datepicker__day" aria-label="11 October" data-value="2026-10-11" data-field="dueDate" data-toggles="datePickerOpen">11</button>
          <button type="button" class="ds-datepicker__day" aria-label="12 October" data-value="2026-10-12" data-field="dueDate" data-toggles="datePickerOpen">12</button>
          <button type="button" class="ds-datepicker__day" aria-label="13 October" data-value="2026-10-13" data-field="dueDate" data-toggles="datePickerOpen">13</button>
          <button type="button" class="ds-datepicker__day ds-datepicker__day--today" aria-label="14 October" data-value="2026-10-14" data-field="dueDate" data-toggles="datePickerOpen">14</button>
          <button type="button" class="ds-datepicker__day" aria-label="15 October" data-value="2026-10-15" data-field="dueDate" data-toggles="datePickerOpen">15</button>
          <button type="button" class="ds-datepicker__day ds-datepicker__day--has-items" aria-label="16 October" data-value="2026-10-16" data-field="dueDate" data-toggles="datePickerOpen">16</button>
          <button type="button" class="ds-datepicker__day" aria-label="17 October" data-value="2026-10-17" data-field="dueDate" data-toggles="datePickerOpen">17</button>
          <button type="button" class="ds-datepicker__day" aria-label="18 October" data-value="2026-10-18" data-field="dueDate" data-toggles="datePickerOpen">18</button>
          <button type="button" class="ds-datepicker__day" aria-label="19 October" data-value="2026-10-19" data-field="dueDate" data-toggles="datePickerOpen">19</button>
          <button type="button" class="ds-datepicker__day ds-datepicker__day--selected ds-datepicker__day--has-items" aria-label="20 October" data-value="2026-10-20" data-field="dueDate" data-toggles="datePickerOpen" aria-pressed="true">20</button>
          <button type="button" class="ds-datepicker__day" aria-label="21 October" data-value="2026-10-21" data-field="dueDate" data-toggles="datePickerOpen">21</button>
          <button type="button" class="ds-datepicker__day" aria-label="22 October" data-value="2026-10-22" data-field="dueDate" data-toggles="datePickerOpen">22</button>
          <button type="button" class="ds-datepicker__day" aria-label="23 October" data-value="2026-10-23" data-field="dueDate" data-toggles="datePickerOpen">23</button>
          <button type="button" class="ds-datepicker__day" aria-label="24 October" data-value="2026-10-24" data-field="dueDate" data-toggles="datePickerOpen">24</button>
          <button type="button" class="ds-datepicker__day" aria-label="25 October" data-value="2026-10-25" data-field="dueDate" data-toggles="datePickerOpen">25</button>
          <button type="button" class="ds-datepicker__day" aria-label="26 October" data-value="2026-10-26" data-field="dueDate" data-toggles="datePickerOpen">26</button>
          <button type="button" class="ds-datepicker__day" aria-label="27 October" data-value="2026-10-27" data-field="dueDate" data-toggles="datePickerOpen">27</button>
          <button type="button" class="ds-datepicker__day" aria-label="28 October" data-value="2026-10-28" data-field="dueDate" data-toggles="datePickerOpen">28</button>
          <button type="button" class="ds-datepicker__day" aria-label="29 October" data-value="2026-10-29" data-field="dueDate" data-toggles="datePickerOpen">29</button>
          <button type="button" class="ds-datepicker__day" aria-label="30 October" data-value="2026-10-30" data-field="dueDate" data-toggles="datePickerOpen">30</button>
          <button type="button" class="ds-datepicker__day" aria-label="31 October" data-value="2026-10-31" data-field="dueDate" data-toggles="datePickerOpen">31</button>
          <button type="button" class="ds-datepicker__day ds-datepicker__day--outside" aria-label="1 November" data-value="2026-11-01" data-field="dueDate" data-toggles="datePickerOpen">1</button>
        </div>
        <div class="ds-datepicker__footer">
          <button type="button" class="ds-button ds-button--ghost ds-button--small" data-value="2026-10-14" data-field="dueDate" data-toggles="datePickerOpen">Today</button>
          <button type="button" class="ds-button ds-button--ghost ds-button--small" data-value="" data-field="dueDate" data-toggles="datePickerOpen">Clear</button>
        </div>
      </div>
    </div>
  </div>
</div>
