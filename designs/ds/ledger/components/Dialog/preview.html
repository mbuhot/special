<!-- @dsCard group="Actions" height=250 subtitle="Popover form panel" -->
<div class="ds-main">
  <div class="ds-table__actions" style="width: 300px; height: 190px; align-items: flex-start">
    <button type="button" class="ds-button ds-button--secondary ds-button--small">Reassign</button>
    <div role="dialog" aria-label="Reassign task" class="ds-dialog">
      <label class="ds-dialog__title" for="d-owner">Reassign Send proposal to</label>
      <select id="d-owner" class="ds-select"><option>Alex Morgan</option><option>Sam Lee</option></select>
      <div class="ds-dialog__actions">
        <button type="button" class="ds-button ds-button--secondary">Cancel</button>
        <button type="button" class="ds-button ds-button--primary">Reassign</button>
      </div>
    </div>
  </div>
</div>
