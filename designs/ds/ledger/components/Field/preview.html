<!-- @dsCard group="Forms" height=300 subtitle="Input, select, textarea, checkbox" -->
<div class="ds-main ds-stack">
  <div class="ds-row ds-row--end">
    <div class="ds-field ds-field--md"><label class="ds-field__label" for="f-name">Name</label><input id="f-name" class="ds-input" placeholder="Send proposal" /></div>
    <div class="ds-field ds-field--md"><label class="ds-field__label" for="f-due">Due</label><input id="f-due" type="date" class="ds-input" value="2026-10-14" /></div>
    <div class="ds-field ds-field--md"><label class="ds-field__label" for="f-owner">Owner</label><select id="f-owner" class="ds-select"><option>Alex Morgan</option><option>Sam Lee</option></select></div>
  </div>
  <div class="ds-field ds-field--lg"><label class="ds-field__label" for="f-notes">Notes</label><textarea id="f-notes" class="ds-textarea" placeholder="Add context"></textarea></div>
  <label class="ds-row ds-row--tight"><input type="checkbox" class="ds-checkbox" checked /> <span>Notify owner</span></label>
</div>
