<!-- @dsCard group="Data" height=260 subtitle="Heads, rows and actions" -->
<div class="ds-main">
  <table class="ds-table">
    <thead>
      <tr>
        <th class="ds-table__head ds-table__head--check"><input type="checkbox" class="ds-checkbox" aria-label="Select all" /></th>
        <th class="ds-table__head">Task</th>
        <th class="ds-table__head">Due</th>
        <th class="ds-table__head ds-table__head--end">Value</th>
        <th class="ds-table__head"><span class="ds-sr-only">Actions</span></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="ds-table__cell ds-table__cell--check"><input type="checkbox" class="ds-checkbox" aria-label="Select row" /></td>
        <td class="ds-table__cell">Send proposal</td>
        <td class="ds-table__cell ds-table__cell--muted">12 Oct</td>
        <td class="ds-table__cell ds-table__cell--end ds-numeric">$12,400.00</td>
        <td class="ds-table__cell"><div class="ds-table__actions"><button type="button" class="ds-button ds-button--ghost ds-button--icon" aria-label="Row actions">&#8942;</button></div></td>
      </tr>
      <tr>
        <td class="ds-table__cell ds-table__cell--check"><input type="checkbox" class="ds-checkbox" aria-label="Select row" checked /></td>
        <td class="ds-table__cell">Book kickoff call</td>
        <td class="ds-table__cell ds-table__cell--muted">14 Oct</td>
        <td class="ds-table__cell ds-table__cell--end ds-numeric">$3,050.00</td>
        <td class="ds-table__cell"><div class="ds-table__actions"><button type="button" class="ds-button ds-button--ghost ds-button--icon" aria-label="Row actions">&#8942;</button></div></td>
      </tr>
    </tbody>
  </table>
</div>
