<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pipeline board</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
            font-family:
              system-ui,
              -apple-system,
              "Segoe UI",
              sans-serif;
            color: #0f172a;
          }
          a {
            color: #1d4ed8;
          }
          a:hover {
            color: #1e40af;
          }
        </style>
      </helmet>
      <div
        style="
          width: 1280px;
          height: 800px;
          display: flex;
          background: #ffffff;
          color: #0f172a;
          font-family:
            system-ui,
            -apple-system,
            &quot;Segoe UI&quot;,
            sans-serif;
          overflow: hidden;
        "
      >
        <nav
          data-surface="Sidebar"
          style="
            width: 240px;
            height: 800px;
            box-sizing: border-box;
            flex: none;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 20px 16px;
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
          "
        >
          <div style="padding: 4px 12px; font-size: 18px; font-weight: 700; color: #0f172a">
            Ledger CRM
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <a
              href="#"
              data-control="Dashboard"
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                border-radius: 8px;
                color: #334155;
                font-size: 14px;
                font-weight: 500;
                text-decoration: none;
              "
            >
              <svg
                aria-hidden="true"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="flex: none"
              >
                <rect x="3" y="3" width="7" height="9" rx="1" />
                <rect x="14" y="3" width="7" height="5" rx="1" />
                <rect x="14" y="12" width="7" height="9" rx="1" />
                <rect x="3" y="16" width="7" height="5" rx="1" />
              </svg>
              <span>Dashboard</span>
            </a>
            <a
              href="#"
              data-control="Contacts"
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                border-radius: 8px;
                color: #334155;
                font-size: 14px;
                font-weight: 500;
                text-decoration: none;
              "
            >
              <svg
                aria-hidden="true"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="flex: none"
              >
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" />
              </svg>
              <span>Contacts</span>
            </a>
            <a
              href="#"
              data-control="Companies"
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                border-radius: 8px;
                color: #334155;
                font-size: 14px;
                font-weight: 500;
                text-decoration: none;
              "
            >
              <svg
                aria-hidden="true"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="flex: none"
              >
                <path d="M4 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16" />
                <path d="M14 10h5a1 1 0 0 1 1 1v10" />
                <path d="M8 8h2M8 12h2M8 16h2M2 21h20" />
              </svg>
              <span>Companies</span>
            </a>
            <a
              href="#"
              data-control="Pipeline"
              aria-current="page"
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                border-radius: 8px;
                background: #eff6ff;
                color: #1d4ed8;
                font-size: 14px;
                font-weight: 600;
                text-decoration: none;
              "
            >
              <svg
                aria-hidden="true"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="flex: none"
              >
                <path d="M3 4h18l-7 8v7l-4 2v-9z" />
              </svg>
              <span>Pipeline</span>
            </a>
            <a
              href="#"
              data-control="Invoices"
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                border-radius: 8px;
                color: #334155;
                font-size: 14px;
                font-weight: 500;
                text-decoration: none;
              "
            >
              <svg
                aria-hidden="true"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="flex: none"
              >
                <path d="M6 3h9l4 4v14H6z" />
                <path d="M14 3v5h5" />
                <path d="M9 13h7M9 17h7" />
              </svg>
              <span>Invoices</span>
            </a>
          </div>
          <div style="flex: 1"></div>
          <div
            data-control="Signed in as"
            style="
              display: flex;
              flex-direction: column;
              gap: 2px;
              padding: 12px;
              border-top: 1px solid #e2e8f0;
            "
          >
            <div style="font-size: 12px; color: #64748b">Signed in as</div>
            <div style="font-size: 14px; font-weight: 600; color: #0f172a">Sales rep</div>
            <div style="font-size: 12px; color: #64748b">sales-rep@example.com</div>
          </div>
          <button
            type="button"
            data-control="Sign out"
            style="
              margin-top: -12px;
              padding: 8px 12px;
              border: 1px solid #cbd5e1;
              border-radius: 8px;
              background: #ffffff;
              color: #334155;
              font-size: 14px;
              font-weight: 600;
              font-family: inherit;
              cursor: pointer;
            "
          >
            Sign out
          </button>
          <button
            type="button"
            data-control="Sign out"
            style="
              margin-top: -12px;
              padding: 8px 12px;
              border: 1px solid #cbd5e1;
              border-radius: 8px;
              background: #ffffff;
              color: #334155;
              font-size: 14px;
              font-weight: 600;
              font-family: inherit;
              cursor: pointer;
            "
          >
            Sign out
          </button>
        </nav>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 72px; box-sizing: border-box; flex: none; padding: 0 32px; border-bottom: 1px solid #e2e8f0;">
            <h1 style="margin: 0; font-size: 24px; font-weight: 600; color: #0f172a">Pipeline</h1>
            <a href="../deal-editor/default.dc.html" data-control="New deal" style="padding: 8px 16px; border: 0; border-radius: 8px; background: #1d4ed8; color: #ffffff; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; text-decoration: none;">New deal</a>
          </header>
          <main data-surface="Pipeline board" style="flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; align-items: start; padding: 32px; background: #ffffff;">
            <section data-control="Lead column" style="display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; min-height: 400px; padding: 16px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc;">
              <h2 style="margin: 0; font-size: 14px; font-weight: 600; color: #0f172a">Lead</h2>
            </section>
            <section data-control="Qualified column" style="display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; min-height: 400px; padding: 16px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc;">
              <h2 style="margin: 0; font-size: 14px; font-weight: 600; color: #0f172a">Qualified</h2>
            </section>
            <section data-control="Proposal column" style="display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; min-height: 400px; padding: 16px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc;">
              <h2 style="margin: 0; font-size: 14px; font-weight: 600; color: #0f172a">Proposal</h2>
              <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; background: #ffffff;">
                <a href="../deal-page/proposal.dc.html" style="font-size: 14px; font-weight: 600; text-decoration: none">Big deal</a>
                <span style="font-size: 13px; color: #64748b">Acme</span>
                <span style="font-size: 13px; color: #0f172a">$12,000.00</span>
                <div style="display: flex; gap: 8px">
                  <button type="button" data-control="Win" data-next-state="won" style="padding: 8px 16px; border: 0; border-radius: 8px; background: #1d4ed8; color: #ffffff; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; text-decoration: none; padding: 4px 12px; font-size: 13px;">Win</button>
                  <button type="button" data-control="Lose" data-next-state="lost" style="padding: 8px 16px; border: 1px solid #cbd5e1; border-radius: 8px; background: #ffffff; color: #334155; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; text-decoration: none; padding: 4px 12px; font-size: 13px;">Lose</button>
                </div>
              </div>
            </section>
            <section data-control="Won column" style="display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; min-height: 400px; padding: 16px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc;">
              <h2 style="margin: 0; font-size: 14px; font-weight: 600; color: #0f172a">Won</h2>
            </section>
            <section data-control="Lost column" style="display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; min-height: 400px; padding: 16px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc;">
              <h2 style="margin: 0; font-size: 14px; font-weight: 600; color: #0f172a">Lost</h2>
            </section>
          </main>
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
      class Component extends DCLogic {
      renderVals() {
      return {};
      }
      }
    </script>
  </body>
</html>
