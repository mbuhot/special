<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Login</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          input:not([type="checkbox"]):not([type="radio"]), select, button {
            box-sizing: border-box;
            height: 36px;
            margin: 0;
            font-family: inherit;
            font-size: 14px;
            line-height: 20px;
            vertical-align: middle;
          }
          select, input[type="date"] {
            -webkit-appearance: none;
            appearance: none;
          }
          select {
            padding-right: 28px !important;
            background-image: linear-gradient(45deg, transparent 50%, #64748b 50%), linear-gradient(135deg, #64748b 50%, transparent 50%) !important;
            background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50% !important;
            background-size: 5px 5px, 5px 5px !important;
            background-repeat: no-repeat !important;
          }
          td input:not([type="checkbox"]), td select, td button {
            height: 32px;
            font-size: 13px;
          }
          a[data-control][style*="border-radius: 8px"][style*="padding: 8px 16px"] {
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            height: 36px;
          }
          body {
            margin: 0;
            font-family:
              system-ui,
              -apple-system,
              "Segoe UI",
              sans-serif;
            color: #0f172a;
          }
        </style>
      </helmet>
      <div
        style="
          width: 1280px;
          height: 800px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #f8fafc;
          color: #0f172a;
          font-family:
            system-ui,
            -apple-system,
            &quot;Segoe UI&quot;,
            sans-serif;
          overflow: hidden;
        "
      >
        <main
          data-surface="Login"
          style="
            width: 360px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 32px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #ffffff;
          "
        >
          <div style="font-size: 18px; font-weight: 700; color: #0f172a">Ledger CRM</div>
          <h1 style="margin: 0; font-size: 24px; font-weight: 600; color: #0f172a">Log in</h1>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="login-email" style="font-size: 12px; color: #64748b">Email</label>
            <input
              id="login-email"
              type="email"
              autocomplete="email"
              data-control="Email"
              style="
                width: 100%;
                padding: 8px 12px;
                border: 1px solid #cbd5e1;
                border-radius: 8px;
                background: #ffffff;
                color: #0f172a;
                font-size: 14px;
                font-family: inherit;
                box-sizing: border-box;
              "
            />
          </div>
          <button
            type="button"
            data-control="Log in"
            style="
              padding: 8px 16px;
              border: 0;
              border-radius: 8px;
              background: #1d4ed8;
              color: #ffffff;
              font-size: 14px;
              font-weight: 600;
              font-family: inherit;
              cursor: pointer;
            "
          >
            Log in
          </button>
        </main>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
      class Component extends DCLogic {
      renderVals() {
      return { ...this.props };
      }
      }
    </script>
  </body>
</html>
